name = "aprscaching-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# routes (set after domain is on Cloudflare):
# routes = [{ pattern = "api.aprscaching.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RegionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionRoom"]   # SQLite-backed DO => works on Workers Free too

[[d1_databases]]
binding = "DB"
database_name = "aprscaching"
database_id = "REPLACE_AFTER_create"
migrations_dir = "../../db/migrations"   # shared schema lives at repo root

[[r2_buckets]]
binding = "TILES"
bucket_name = "aprscaching-assets"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aprscaching-media"   # audio-cache clue storage

[triggers]
crons = ["0 4 * * *", "*/15 * * * *"]   # nightly TTL/rollup + federation pull-sync every 15 min

[vars]
# INGEST_SECRET is a SECRET, never a [vars] default — set it before first deploy:
#   wrangler secret put INGEST_SECRET          (required; sessions are refused while it is unset/'change-me')
#   wrangler secret put SESSION_SECRET         (recommended: decouples user sessions from the ingest credential)
# For local `wrangler dev`, put both in workers/gateway/.dev.vars (gitignored).
INSTANCE = "aprscaching.local"   # canonical federation instance id (use your domain in prod)
# FED_PEERS = "https://peer.example/"          # advertised peer instances
# Position storage (docs/operate/deployment.md "Cost on D1"): a fix is stored once its station moved this many
# metres or this many seconds passed; protected stations and RF hearings are always stored. 0 stores every fix.
# POS_MIN_MOVE_M = "25"
# POS_MIN_INTERVAL_S = "600"
# Signed federation feeds: generate a key (node tools/fedkey/genkey.mjs) then:
#   wrangler secret put FED_PRIVATE_KEY
