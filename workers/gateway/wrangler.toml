name = "aprscaching-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# routes (set after domain is on Cloudflare):
# routes = [{ pattern = "api.aprscaching.net", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RegionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionRoom"]   # SQLite-backed DO => works on Workers Free too

[[d1_databases]]
binding = "DB"
database_name = "aprscaching"
database_id = "REPLACE_AFTER_create"
migrations_dir = "../../db/migrations"   # shared schema lives at repo root

[[r2_buckets]]
binding = "TILES"
bucket_name = "aprscaching-assets"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aprscaching-media"   # audio-cache clue storage

[triggers]
crons = ["0 4 * * *", "*/15 * * * *"]   # nightly TTL/rollup + federation pull-sync every 15 min

[vars]
# Secrets are never [vars] defaults — set them before the first deploy (deploy/cloudflare/deploy-cf.sh does):
#   wrangler secret put INGEST_SECRET     (required: the ingest plane is closed while it is unset or 'change-me')
#   wrangler secret put SESSION_SECRET    (required for sign-in: the Worker mints no session without it)
#   wrangler secret put OPERATOR_SECRET   (optional: the operator's scripts; unset closes those paths)
# For local `wrangler dev`, put them in workers/gateway/.dev.vars (gitignored).
# APP_URL and ADMIN_CALLSIGNS come from deploy/cloudflare/publish.sh (`--var`), which takes them from
# deploy-cf.sh or the values `deploy/aprscaching init cloudflare` recorded. INSTANCE and RP_ID follow from
# APP_URL's host; set INSTANCE here only for a federation id that differs from it.
# FED_PEERS = "https://peer.example/"          # advertised peer instances
# Position storage (docs/reference/cloudflare-costs.md "Cost on D1"): a fix is stored once its station moved this many
# metres or this many seconds passed; protected stations and RF hearings are always stored. 0 stores every fix.
# POS_MIN_MOVE_M = "25"
# POS_MIN_INTERVAL_S = "600"
# Daily D1 write budget (docs/reference/cloudflare-costs.md "Write budget"): near it the gateway sheds low-value writes
# and alerts the sysop; protected data is always stored. Unset = 1500000 on the Worker. Workers Free: 90000. 0 = off.
# D1_DAILY_WRITE_BUDGET = "90000"
# The embeddable map widget (/embed) loads MapLibre from the Pages site at APP_URL; its basemap is BASEMAP_STYLE
# (a MapLibre style URL, or "offline" for the self-contained grid; unset = OpenFreeMap liberty).
# BASEMAP_STYLE = "offline"
# Signed federation feeds: generate a key (node tools/fedkey/genkey.mjs) then:
#   wrangler secret put FED_PRIVATE_KEY
