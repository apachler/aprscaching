name: Playwright Chromium
description: >-
  The Chromium revision the locked playwright-core expects, in ~/.cache/ms-playwright, plus its system libraries.
  The browser download is cached under the playwright-core version; the libraries come from apt on every run.
  Runs after pnpm install.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
    # with the browser restored, the install only fetches the system libraries
    - shell: bash
      run: pnpm exec playwright-core install --with-deps chromium
