# Transport conformance against real modem software: our KISS TCP, AGWPE and IGate code driving
# Direwolf over a real Bell-202 AFSK audio path. Weekly + manual — never the PR loop: the peers come
# from package archives and container builds, which are not PR-gating dependencies.
name: transports
on:
  schedule:
    - cron: "41 3 * * 4" # weekly, Thursday 03:41 UTC
  workflow_dispatch: {}
  push:
    branches: [ci/direwolf-transports]

permissions:
  contents: read

jobs:
  direwolf:
    name: Direwolf (KISS TCP + AGWPE over AFSK, RF -> IGate -> aprsc)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -p direwolf -f tools/interop/direwolf/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: $COMPOSE up -d --build
      - run: sleep 20 && $COMPOSE logs --tail 30
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/direwolf-loop.mjs
      # on failure: container states + full logs — both modems print every frame they decode
      - if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --tail 200
      - if: always()
        run: $COMPOSE down -v
