name: release-please

# Automates versioning + CHANGELOG + release tags from Conventional Commits. Releases happen only on
# `main`: each push opens/updates a release PR; merging that PR creates the vX.Y.Z tag and the GitHub
# release. The initial commit carries a `Release-As: 1.0.0` footer, so the first merge of `dev` into
# `main` yields the 1.0.0 release PR.
#
# A tag pushed with the workflow's own GITHUB_TOKEN starts no other workflow, so the release
# artifacts (the OCI stack zip and the desktop binaries) are built here, as called workflows, once
# release-please reports a new release; release-verify then adds the git bundle, the checksums and the
# signed attestations over all of them.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release PR, tags, and GitHub release
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  oci-stack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the stack zip to the release
    uses: ./.github/workflows/oci-stack.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the desktop binaries to the release
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  verify:
    needs: [release-please, oci-stack, desktop]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the bundle, the source archive and SHA256SUMS
      id-token: write # sign the attestations
      attestations: write
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
