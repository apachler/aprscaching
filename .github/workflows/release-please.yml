name: release-please

# Automates versioning + CHANGELOG + release tags from Conventional Commits. Releases happen only on
# `main`: each push opens/updates a release PR; merging that PR creates the vX.Y.Z tag and the GitHub
# release. Before the first release, release-please reads only the commits after `bootstrap-sha`
# (release-please-config.json), so the 1.0.0 entry in CHANGELOG.md lists no pre-release history; a
# commit after it carries a `Release-As: 1.0.0` footer, and the first merge of `dev` into `main` yields
# the 1.0.0 release PR. CHANGELOG.md is empty until that PR writes the first entry.
#
# The release artifacts (the OCI stack zip and the desktop binaries) are built here, as called
# workflows, once release-please reports a new release, and nowhere else: a pushed tag starts no
# workflow, so each release is built once. release-verify then adds the git bundle, the checksums and
# the signed attestations over all of them. Once the release exists, `sync-dev` brings `dev` up to `main`.
#
# A release reaches `main` one of two ways, both pull requests merged with a merge commit: `dev` into `main`, or a
# `hotfix/vX.Y.Z` branch cut from the release tag into `main` (CONTRIBUTING.md, Releases). main-pr.yml refuses any
# other head branch.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release PR, tags, and GitHub release
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  oci-stack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the stack zip to the release
    uses: ./.github/workflows/oci-stack.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the desktop binaries to the release
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  verify:
    needs: [release-please, oci-stack, desktop]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the bundle, the source archive, the SBOM and SHA256SUMS
      id-token: write # sign the attestations
      attestations: write
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # After a release, `dev` contains everything `main` does: the release commit (CHANGELOG.md, the manifest, the
  # version) and, after a hotfix, the fix itself. When `dev` has not moved since `main` took it, `dev` is
  # fast-forwarded to `main`. Otherwise, or when a ruleset refuses the push, the job opens a pull request from
  # `main` into `dev`, which is merged with a merge commit: a squash would leave `main`'s commits outside `dev`'s
  # history, and the next merge of `dev` into `main` would conflict on them.
  sync-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # fast-forward dev
      pull-requests: write # or open the pull request into dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: bring dev up to main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main dev
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main"
            exit 0
          fi
          if git merge-base --is-ancestor origin/dev origin/main; then
            # a plain push, never forced: it lands only when it is a fast-forward
            if git push origin "$(git rev-parse origin/main):refs/heads/dev"; then
              echo "dev fast-forwarded to main ($TAG)"
              exit 0
            fi
            echo "the fast-forward was refused; opening a pull request instead"
          fi
          open=$(gh pr list --base dev --head main --state open --json url --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            echo "a pull request from main into dev is open: $open"
            exit 0
          fi
          printf '%s\n\n%s\n' \
            "Brings \`dev\` up to \`main\` after $TAG: the release commit, and any hotfix released from \`main\`." \
            "Merge it with a **merge commit**, never a squash, so that \`dev\`'s history contains \`main\`'s commits." \
            > body.md
          gh pr create --base dev --head main --title "chore(release): bring dev up to $TAG" --body-file body.md

  # Each release opens a discussion in Announcements, linked to the release, so people watching the
  # repository or its discussions hear about it. It runs last, once the release carries all its assets.
  # The release notes open with the operator actions of every change since the previous release: each
  # `Operator-Action:` footer in a commit message, which is the pull request's description on a squash.
  operator-notes:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the release notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: put the operator actions at the top of the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          [ -n "$prev" ] || { echo "no earlier release: nothing to collect"; exit 0; }
          notes=$(git log --format='%B%n' "$prev..$TAG" | awk '/^Operator-Action:/{on=1; sub(/^Operator-Action:[ ]*/, "- ")} /^$/{on=0} on')
          [ -n "$notes" ] || { echo "no operator actions between $prev and $TAG"; exit 0; }
          body=$(gh release view "$TAG" --json body --jq .body)
          printf '## Operator actions\n\nDo these when you update from %s or earlier.\n\n%s\n\n%s\n' "$prev" "$notes" "$body" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  announce:
    needs: [release-please, verify, operator-notes]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the release to link the discussion
      discussions: write # create the discussion
    steps:
      - name: open the release discussion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)
          gh api -X PATCH "repos/$REPO/releases/$id" -f discussion_category_name=Announcements --jq .discussion_url
