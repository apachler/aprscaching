name: release-please

# Automates versioning + CHANGELOG + release tags from Conventional Commits. Releases happen only on
# `main`: each push opens/updates a release PR; merging that PR creates the vX.Y.Z tag and the GitHub
# release (the desktop-release workflow fires on the tag). The initial commit carries a
# `Release-As: 1.0.0` footer, so the first merge of `dev` into `main` yields the 1.0.0 release PR.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release PR, tags, and GitHub release
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
