# Interoperability against real packet software (LinBPQ, F6FBB, TNN, JNOS). Scheduled + manual —
# never the PR loop: peer downloads, source builds, and the host kernel ax25 module are not
# PR-gating dependencies. The no-Docker local loop runs first as the in-repo baseline.
name: interop
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  local-loop:
    name: local loop (two stacks over AXUDP, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash tools/interop/run-local-loop.sh

  linbpq:
    name: LinBPQ peer (NODES + FBB forwarding)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      ACS_AXUDP_PEERS: linbpq:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f tools/interop/docker-compose.yml up -d --build acs linbpq
      # wire capture — the AXUDP truth for any assertion dispute (printed on failure)
      - run: sudo tcpdump -i any -nn udp port 10093 -w /tmp/axudp.pcap >/dev/null 2>&1 &
      - run: sleep 20 && docker compose -f tools/interop/docker-compose.yml logs --tail 30
      # our LAPB initiator dials the real BPQ node over AXUDP and must get its CTEXT
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/bpq-dial.mjs
      - run: node tools/interop/tests/bpq-loop.mjs
      # on failure: container states + full logs + the wire capture, so both ends AND the datagrams
      # are diagnosable from the run page
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml ps -a
          docker compose -f tools/interop/docker-compose.yml logs --tail 200
          sudo tcpdump -nn -tttt -r /tmp/axudp.pcap 2>/dev/null | tail -120 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml down -v

  fbb:
    name: F6FBB peer (kernel AX.25 + ax25ipd)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      ACS_AXUDP_PEERS: fbb:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # the fbb container attaches kernel AX.25 ports — the module must exist on the runner host
      - run: sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
      - run: sudo modprobe ax25 || echo "ax25 module unavailable — fbb will run telnet-only"
      - run: docker compose -f tools/interop/docker-compose.yml --profile fbb up -d --build acs fbb
      - run: sleep 25 && docker compose -f tools/interop/docker-compose.yml logs --tail 30 fbb
      # FBB's telnet gate requires a REGISTERED user — the smoke asserts the SID banner and the
      # refusal of an unknown callsign (see tools/interop/README)
      - run: node tools/interop/tests/fbb-smoke.mjs
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile fbb down -v

  aprsis:
    name: aprsc peer (APRS-IS login + filter + delivery)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      # the acs ingest dials the real aprsc container as a verified client
      ACS_APRSIS_HOST: aprsc
      ACS_APRSIS_PORT: "14580"
      ACS_APRSIS_CALLSIGN: OE1ACS-10
      ACS_APRSIS_PASSCODE: "20149"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f tools/interop/docker-compose.yml --profile aprsis up -d --build acs aprsc
      - run: sleep 20 && docker compose -f tools/interop/docker-compose.yml --profile aprsis logs --tail 30
      - run: node tools/interop/tests/aprsis-loop.mjs
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile aprsis ps -a
          docker compose -f tools/interop/docker-compose.yml --profile aprsis logs --tail 200
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile aprsis down -v

  extra-peers:
    name: TNN + JNOS peers (source builds)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 30
    env:
      ACS_AXUDP_PEERS: tnn:10093,jnos:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # each peer builds in its own bounded step so one dead mirror or a wedged build cannot
      # cancel the other peer or hang the nightly
      - id: build-tnn
        continue-on-error: true
        timeout-minutes: 10
        run: docker compose -f tools/interop/docker-compose.yml --profile extra build tnn
      - id: build-jnos
        continue-on-error: true
        timeout-minutes: 10
        run: docker compose -f tools/interop/docker-compose.yml --profile extra build jnos
      # wire capture — the AXUDP truth for any assertion dispute (printed on failure)
      - run: sudo tcpdump -i any -nn udp port 10093 -w /tmp/axudp.pcap >/dev/null 2>&1 &
      - run: |
          peers=""
          [ "${{ steps.build-tnn.outcome }}" = "success" ] && peers="$peers tnn"
          [ "${{ steps.build-jnos.outcome }}" = "success" ] && peers="$peers jnos"
          if [ -z "$peers" ]; then echo "::error::no extra peer built — both source mirrors failed"; exit 1; fi
          docker compose -f tools/interop/docker-compose.yml --profile extra up -d --build acs $peers
      - run: sleep 25 && docker compose -f tools/interop/docker-compose.yml --profile extra logs --tail 30
      - run: >
          TNN_UP=${{ steps.build-tnn.outcome }} JNOS_UP=${{ steps.build-jnos.outcome }}
          node tools/interop/tests/extra-peers.mjs
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile extra ps -a
          docker compose -f tools/interop/docker-compose.yml --profile extra logs --tail 200
          echo '--- JNOS: build has AXIP? trace file? console ifconfig/netrom state'
          docker compose -f tools/interop/docker-compose.yml --profile extra exec -T jnos \
            sh -c 'grep -c "^#define AXIP" /opt/jnos/config.h 2>/dev/null; ls -la /opt/jnos/axu0.trace 2>&1; head -40 /opt/jnos/axu0.trace 2>/dev/null' || true
          printf 'interop\r\ninterop\r\nifconfig\r\nnetrom status\r\nattach\r\nexit\r\n' | timeout 15 nc -q 5 127.0.0.1 2323 | head -60 || true
          echo '--- TNN: startup batch log + console AXIPR/PORT state'
          docker compose -f tools/interop/docker-compose.yml --profile extra exec -T tnn \
            sh -c 'cat startup.log 2>/dev/null; echo ---; cat ax25ip.log 2>/dev/null' || true
          printf 'interop\r\nAXIPR\r\nPORT *\r\nMH\r\nQUIT\r\n' | timeout 15 nc -q 5 127.0.0.1 4711 | head -60 || true
          sudo tcpdump -nn -tttt -r /tmp/axudp.pcap 2>/dev/null | tail -40 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile extra down -v
