# Interoperability against real packet software (LinBPQ, F6FBB, TNN, JNOS, aprsc, the kernel AX.25
# stack). Weekly + manual —
# never the PR loop: peer downloads, source builds, and the host kernel ax25 module are not
# PR-gating dependencies. The no-Docker local loop runs first as the in-repo baseline.
name: interop
on:
  schedule:
    - cron: "17 3 * * 3" # weekly, Wednesday 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  local-loop:
    name: local loop (two stacks over AXUDP, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash tools/interop/run-local-loop.sh
      - name: the same loop with federation over FBB on for the partner
        run: FED_BBS=1 bash tools/interop/run-local-loop.sh

  linbpq:
    name: LinBPQ peer (NODES + FBB forwarding)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      ACS_AXUDP_PEERS: linbpq:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f tools/interop/docker-compose.yml up -d --build acs linbpq
      # wire capture — the AXUDP truth for any assertion dispute (printed on failure)
      - run: sudo tcpdump -i any -nn udp port 10093 -w /tmp/axudp.pcap >/dev/null 2>&1 &
      - run: sleep 20 && docker compose -f tools/interop/docker-compose.yml logs --tail 30
      # our LAPB initiator dials the real BPQ node over AXUDP and must get its CTEXT
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/bpq-dial.mjs
      - run: node tools/interop/tests/bpq-loop.mjs
      # on failure: container states + full logs + the wire capture, so both ends AND the datagrams
      # are diagnosable from the run page
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml ps -a
          docker compose -f tools/interop/docker-compose.yml logs --tail 200
          sudo tcpdump -nn -tttt -r /tmp/axudp.pcap 2>/dev/null | tail -120 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml down -v

  fbb:
    name: F6FBB peer (telnet mail exchange + kernel AX.25 over AXUDP)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      # fbb runs on the host network (kernel AX.25); acs reaches its ax25ipd at the compose gateway
      ACS_AXUDP_PEERS: 172.31.93.1:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # the fbb container attaches a kernel AX.25 port — ax25 and mkiss must be loaded on the runner host
      - run: sudo apt-get update && sudo bash tools/interop/ax25kernel/load-modules.sh
      # wire capture — the AXUDP truth for any assertion dispute (printed on failure)
      - run: sudo tcpdump -i any -nn udp port 10093 or udp port 10094 -w /tmp/axudp.pcap >/dev/null 2>&1 &
      - run: docker compose -f tools/interop/docker-compose.yml --profile fbb up -d --build acs fbb
      # the kernel path is required: start.sh exits without it, and this step fails unless the AX.25
      # device and ax25ipd are up on the host
      - run: |
          timeout 60 sh -c 'until docker compose -f tools/interop/docker-compose.yml --profile fbb logs fbb | grep -q "kernel AX.25 port axudp on"; do
            [ "$(docker inspect -f "{{.State.Running}}" "$(docker compose -f tools/interop/docker-compose.yml --profile fbb ps -aq fbb)")" = true ] || exit 1
            sleep 1
          done'
          ip -br link | grep '^ax'
      # xfbbd serves once its first run has created the data files (start.sh, about 20 s)
      - run: timeout 90 sh -c 'until nc -z 127.0.0.1 6300; do sleep 1; done' && sleep 3
      # xfbbd's listener for its BBS call is bound on the kernel port
      - run: docker compose -f tools/interop/docker-compose.yml --profile fbb logs --tail 30 fbb && grep ' OE9FBB-1 ' /proc/net/ax25
      # the acs node's NET/ROM broadcasts (every 10 s) reach the kernel port through AXUDP → ax25ipd;
      # nothing else sends to it yet
      - run: |
          dev=$(ip -br link | awk '/^ax/ { print $1; exit }')
          timeout 30 sh -c "until [ \$(cat /sys/class/net/$dev/statistics/rx_packets) -gt 0 ]; do sleep 1; done"
          echo "$dev received $(cat /sys/class/net/$dev/statistics/rx_packets) frames from acs"
      # FBB's telnet gate requires a REGISTERED user — the smoke asserts the SID banner and the
      # refusal of an unknown callsign (see tools/interop/README)
      - run: node tools/interop/tests/fbb-smoke.mjs
      # our LAPB initiator connects to OE9FBB-1 through AXUDP → ax25ipd → kernel AX.25 and must get FBB's SID
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/fbb-ax25.mjs
      # start.sh registers OE1TST + the partner OE1ACS through the xfbbC sysop console once xfbbd is up
      - run: timeout 90 sh -c 'until docker compose -f tools/interop/docker-compose.yml --profile fbb logs fbb | grep -q "registered through xfbbC"; do sleep 2; done'
      # a full telnet forward session: proposal, delivery, BID dedup, the FBB mailbox, reverse forwarding
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/fbb-forward.mjs
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile fbb ps -a
          docker compose -f tools/interop/docker-compose.yml --profile fbb logs --tail 200
          docker compose -f tools/interop/docker-compose.yml --profile fbb exec -T fbb \
            sh -c 'cat /tmp/kissattach.log /tmp/ax25ipd.log; cat /proc/net/ax25; tail -40 /var/ax25/fbb/log/*' || true
          sudo tcpdump -nn -tttt -r /tmp/axudp.pcap 2>/dev/null | tail -120 || true
          sudo dmesg | grep -iE 'mkiss|ax25' | tail -20 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile fbb down -v

  kiss-kernel:
    name: kernel AX.25 peer (KISS TCP via kissnetd + ax25d)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # the container attaches a kernel AX.25 port — ax25 and mkiss must be loaded on the runner host
      - run: sudo apt-get update && sudo bash tools/interop/ax25kernel/load-modules.sh
      - run: docker compose -f tools/interop/docker-compose.yml --profile ax25kernel up -d --build ax25kernel
      - run: sleep 5 && docker compose -f tools/interop/docker-compose.yml --profile ax25kernel logs ax25kernel
      # our KissTnc dials the KISS TCP port; the kernel stack answers through kissnetd
      - run: pnpm -C apps/ingest exec tsx ../../tools/interop/tests/kiss-kernel.mjs
      # on failure: the container log plus the wire tap and the kernel's own view of every frame
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile ax25kernel ps -a
          docker compose -f tools/interop/docker-compose.yml --profile ax25kernel logs --tail 200
          docker compose -f tools/interop/docker-compose.yml --profile ax25kernel exec -T ax25kernel \
            sh -c 'ps -ef; cat /tmp/kissattach.log; echo --- tap; tail -80 /tmp/tap.log; echo --- mon; tail -80 /tmp/mon.log; cat /proc/net/ax25' || true
          sudo dmesg | grep -iE 'mkiss|ax25' | tail -20 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile ax25kernel down -v

  aprsis:
    name: aprsc peer (APRS-IS login + filter + delivery)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 20
    env:
      # the acs ingest dials the real aprsc container as a verified client
      ACS_APRSIS_HOST: aprsc
      ACS_APRSIS_PORT: "14580"
      ACS_APRSIS_CALLSIGN: OE1ACS-10
      ACS_APRSIS_PASSCODE: "20149"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f tools/interop/docker-compose.yml --profile aprsis up -d --build acs aprsc
      - run: sleep 20 && docker compose -f tools/interop/docker-compose.yml --profile aprsis logs --tail 30
      - run: node tools/interop/tests/aprsis-loop.mjs
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile aprsis ps -a
          docker compose -f tools/interop/docker-compose.yml --profile aprsis logs --tail 200
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile aprsis down -v

  extra-peers:
    name: TNN + JNOS peers (source builds)
    runs-on: ubuntu-latest
    needs: local-loop
    timeout-minutes: 30
    env:
      ACS_AXUDP_PEERS: tnn:10093,jnos:10093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # each peer builds in its own bounded step so one dead mirror or a wedged build cannot
      # cancel the other peer or hang the run
      - id: build-tnn
        continue-on-error: true
        timeout-minutes: 10
        run: docker compose -f tools/interop/docker-compose.yml --profile extra build tnn
      - id: build-jnos
        continue-on-error: true
        timeout-minutes: 10
        run: docker compose -f tools/interop/docker-compose.yml --profile extra build jnos
      # wire capture — the AXUDP truth for any assertion dispute (printed on failure)
      - run: sudo tcpdump -i any -nn udp port 10093 -w /tmp/axudp.pcap >/dev/null 2>&1 &
      - run: |
          peers=""
          [ "${{ steps.build-tnn.outcome }}" = "success" ] && peers="$peers tnn"
          [ "${{ steps.build-jnos.outcome }}" = "success" ] && peers="$peers jnos"
          if [ -z "$peers" ]; then echo "::error::no extra peer built — both source mirrors failed"; exit 1; fi
          docker compose -f tools/interop/docker-compose.yml --profile extra up -d --build acs $peers
      - run: sleep 25 && docker compose -f tools/interop/docker-compose.yml --profile extra logs --tail 30
      - run: >
          TNN_UP=${{ steps.build-tnn.outcome }} JNOS_UP=${{ steps.build-jnos.outcome }}
          node tools/interop/tests/extra-peers.mjs
      - if: failure()
        run: |
          docker compose -f tools/interop/docker-compose.yml --profile extra ps -a
          docker compose -f tools/interop/docker-compose.yml --profile extra logs --tail 200
          echo '--- JNOS: build has AXIP? trace file? console ifconfig/netrom state'
          docker compose -f tools/interop/docker-compose.yml --profile extra exec -T jnos \
            sh -c 'grep -c "^#define AXIP" /opt/jnos/config.h 2>/dev/null; ls -la /opt/jnos/axu0.trace 2>&1; head -40 /opt/jnos/axu0.trace 2>/dev/null' || true
          printf 'interop\r\ninterop\r\nifconfig\r\nnetrom status\r\nattach\r\nexit\r\n' | timeout 15 nc -q 5 127.0.0.1 2323 | head -60 || true
          echo '--- TNN: startup batch log + console AXIPR/PORT state'
          docker compose -f tools/interop/docker-compose.yml --profile extra exec -T tnn \
            sh -c 'cat startup.log 2>/dev/null; echo ---; cat ax25ip.log 2>/dev/null' || true
          printf 'interop\r\nAXIPR\r\nPORT *\r\nMH\r\nQUIT\r\n' | timeout 15 nc -q 5 127.0.0.1 4711 | head -60 || true
          sudo tcpdump -nn -tttt -r /tmp/axudp.pcap 2>/dev/null | tail -40 || true
      - if: always()
        run: docker compose -f tools/interop/docker-compose.yml --profile extra down -v
