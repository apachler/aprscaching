name: scorecard

# OpenSSF Scorecard rates the repository's supply-chain practice: pinned actions, branch protection, signed releases,
# dependency updates, token permissions. Results go to the repository's code scanning alerts and to the public
# Scorecard API that the README badge reads. It runs on the default branch only, as the Scorecard action requires;
# here that is `dev`.
on:
  push:
    branches: [dev]
  schedule:
    - cron: "41 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # upload the results to code scanning, and sign them for the public API
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
