name: scorecard

# OpenSSF Scorecard rates the repository's supply-chain practice: pinned actions, branch protection, signed releases,
# dependency updates, token permissions. Results go to the repository's code scanning alerts and to the public
# Scorecard API that the README badge reads. It runs on the default branch only, as the Scorecard action requires;
# here that is `dev`.
on:
  push:
    branches: [dev]
  schedule:
    - cron: "41 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # upload the results to code scanning, and sign them for the public API
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
