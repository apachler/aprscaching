name: DCO

# Verify every commit in a PR carries a `Signed-off-by:` trailer (Developer Certificate of Origin).
# Self-contained — no external action to trust. Contributors sign off with `git commit -s`.
# The same job rejects coding-assistant attribution (co-author trailers, "Generated with" footers)
# in commits and the PR description: the squash commit is built from both.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    # pull requests opened by the workflow token (release-please's release PR, the sync of dev after a release) are
    # github-actions[bot]'s; the job reports as skipped, which a required check accepts once the workflow runs
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: All commits are signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            # skip merge commits (they have >1 parent)
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # release-please's release commits are github-actions[bot]'s and carry no sign-off; they reach a pull
            # request from main into dev after a release
            if [ "$author" = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" ]; then continue; fi
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::Commit $sha ($author) is missing a Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off. Run: git rebase --signoff $BASE  (or git commit -s)."
            echo "See CONTRIBUTING.md → 'Sign your work (DCO)'."
            exit 1
          fi
          echo "All commits signed off."
      - name: No coding-assistant attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='noreply@anthropic\.com|^Co-authored-by: Claude|Generated with \[?Claude Code'
          found=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git show -s --format='%B' "$sha" | grep -qiE "$pattern"; then
              echo "::error::Commit $sha carries coding-assistant attribution."
              found=1
            fi
          done
          if printf '%s\n' "$PR_BODY" | grep -qiE "$pattern"; then
            echo "::error::The PR description carries coding-assistant attribution."
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Remove the attribution lines: git rebase -i $BASE with reword, or edit the PR description."
            exit 1
          fi
          echo "No coding-assistant attribution."
