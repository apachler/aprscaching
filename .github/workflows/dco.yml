name: DCO

# Verify every commit in a PR carries a `Signed-off-by:` trailer (Developer Certificate of Origin).
# Self-contained — no external action to trust. Contributors sign off with `git commit -s`.
# The same job rejects coding-assistant attribution (co-author trailers, "Generated with" footers)
# in commits and the PR description: the squash commit is built from both.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    # pull requests opened by the workflow token (release-please's release PR, the sync of dev after a release) are
    # github-actions[bot]'s; the job reports as skipped, which a required check accepts once the workflow runs. Their
    # unsigned release commits reach no other pull request: once merged they sit below every other PR's base. The
    # opener's login is the one mark of the bot a contributor cannot set; a commit's author string is whatever its
    # maker writes, so no commit is excused by it.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: All commits are signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only what the pull request adds beyond dev is checked: every commit on dev entered it through a pull
          # request this check ran on, or is pushed history, which is never rewritten. A release pull request from dev
          # into main then adds nothing, and a hotfix into main is checked commit by commit. origin/dev is the base
          # repository's branch, which a pull request cannot move; without it the check fails rather than check nothing.
          dev="$(git rev-parse --verify -q 'refs/remotes/origin/dev^{commit}')" \
            || { echo "::error::origin/dev is missing from the checkout."; exit 1; }
          commits="$(git rev-list "$HEAD" --not "$BASE" "$dev")" || { echo "::error::git rev-list failed."; exit 1; }
          missing=0
          for sha in $commits; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then continue; fi
            # A merge commit can carry changes of its own. An unsigned one passes only when its tree is exactly the
            # automatic merge of its two parents, so all it holds is theirs, and they are checked or already in the
            # base. A resolved conflict, an added change or an octopus merge needs the sign-off.
            read -r _ p1 p2 more <<<"$(git rev-list --parents -n 1 "$sha")"
            # merge-tree exits non-zero on a conflict or any other failure, which falls through to the error below
            if [ -n "$p2" ] && [ -z "$more" ] && auto="$(git merge-tree --write-tree "$p1" "$p2" 2>/dev/null)" \
              && [ "$auto" = "$(git rev-parse "$sha^{tree}")" ]; then
              continue
            fi
            if [ -n "$p2" ]; then
              echo "::error::Merge commit $sha ($author) is missing a Signed-off-by line and is not the automatic merge of its parents."
            else
              echo "::error::Commit $sha ($author) is missing a Signed-off-by line."
            fi
            missing=1
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off. Run: git rebase --signoff $BASE  (or git commit -s)."
            echo "See CONTRIBUTING.md → 'Sign your work (DCO)'."
            exit 1
          fi
          echo "All $(printf '%s\n' "$commits" | grep -c .) commits the pull request adds beyond dev are signed off."
      - name: No coding-assistant attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='noreply@anthropic\.com|^Co-authored-by: Claude|Generated with \[?Claude Code'
          found=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git show -s --format='%B' "$sha" | grep -qiE "$pattern"; then
              echo "::error::Commit $sha carries coding-assistant attribution."
              found=1
            fi
          done
          if printf '%s\n' "$PR_BODY" | grep -qiE "$pattern"; then
            echo "::error::The PR description carries coding-assistant attribution."
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Remove the attribution lines: git rebase -i $BASE with reword, or edit the PR description."
            exit 1
          fi
          echo "No coding-assistant attribution."
