name: CI

# A feature branch is tested once, by its pull request; a push runs CI only on the long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: every job here only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change touches. A change to docs only (docs/, mkdocs.yml, Markdown) or to the Pocket scripts only
  # (deploy/pocket/) skips the type-aware lint, the unit tests, the conformance legs and the e2e run: none of
  # them reads those files. Skipped jobs report as skipped, which a required check accepts. When the diff
  # cannot be read, everything runs.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      pocket: ${{ steps.paths.outputs.pocket }}
      helpers: ${{ steps.paths.outputs.helpers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --quiet --depth=1 origin "$BASE" && files=$(git diff --name-only "$BASE" HEAD); then
            code=false
            pocket=false
            helpers=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                deploy/pocket/* | deploy/lib/* | .github/workflows/ci.yml) pocket=true ;;
              esac
              case "$f" in
                deploy/aprscaching | deploy/lib/* | deploy/test/* | deploy/setup.sh | deploy/systemd/* | deploy/.env.example | .github/workflows/ci.yml) helpers=true ;;
              esac
              case "$f" in
                docs/* | mkdocs.yml | *.md | deploy/pocket/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          else
            code=true
            pocket=true
            helpers=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pocket=$pocket" >> "$GITHUB_OUTPUT"
          echo "helpers=$helpers" >> "$GITHUB_OUTPUT"
          echo "code=$code pocket=$pocket helpers=$helpers"

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      # every gateway export has a user outside its own file (module-private code is not exported)
      - run: node tools/checks/dead-exports.mjs
      # the docs stay present-tense, the schema lists every config key the code reads, and nav and links stay whole
      - run: node tools/checks/docs.mjs
      # the configuration page's key tables, both .env.example files and the deploy helpers' export match the schema
      - run: node tools/config/generate.mjs --check

  pocket:
    name: Pocket scripts (shellcheck, ruff, Python tests)
    needs: changes
    if: needs.changes.outputs.pocket == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The phone-side scripts: bash (shellcheck ships on the runner) and the USB bridge in Python. Warning
      # severity: info-level notes (SC2015 on the `[ … ] && [ … ] || die` guards) vary by shellcheck version.
      - run: shellcheck -x -S warning deploy/pocket/*.sh deploy/pocket/extras/*.sh deploy/pocket/test/*.sh deploy/pocket/boot/*
      - run: pipx run ruff check deploy/pocket/extras && pipx run ruff format --check deploy/pocket/extras
      - run: cd deploy/pocket/extras && python3 -m unittest discover -s test -v
      - run: bash deploy/pocket/test/wizard-test.sh
      - run: bash deploy/pocket/test/net44-test.sh

  helpers:
    name: Deploy helpers (shellcheck, tests)
    needs: changes
    if: needs.changes.outputs.helpers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node.js 22+ for the bare-metal checks and the federation key setup.sh generates
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      # deploy/aprscaching, its library and shape modules: bash, checked like the Pocket scripts
      - run: shellcheck -x -S warning deploy/aprscaching deploy/lib/*.sh deploy/lib/shapes/*.sh deploy/test/*.sh
      - run: bash deploy/test/helpers-test.sh

  lint-types:
    name: lint (type-aware, slow)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Type-checked rules over the trust-critical workers/ + MIT packages/ surface. Slower than the
      # fast lint (it builds the TS program), so it's a separate job — see eslint.config.types.mjs.
      - run: pnpm run lint:types

  test:
    name: unit tests + builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r build
      # Repo-level guards over files no package owns: the OCI stack ships as a release zip that a
      # one-click button feeds to Resource Manager, so its internal consistency is checked here.
      - run: node tools/checks/oci-stack.mjs
      # The Worker bundle must carry no RF socket code (ingest listeners/senders are operator-local).
      - run: node tools/checks/worker-bundle.mjs

  conformance-node:
    name: conformance (Node + SQLite)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: start node-gateway + smoke
        # INGEST_SECRET and OPERATOR_SECRET must be shared by BOTH the gateway AND the smoke client (it
        # sends x-ingest-secret for ingest-plane writes and x-operator-secret for operator calls) → set
        # them at step scope, not inline. SESSION_SECRET is the gateway's own session-signing key.
        env:
          INGEST_SECRET: ci-conformance-ingest-secret
          OPERATOR_SECRET: ci-conformance-operator-secret
          SESSION_SECRET: ci-conformance-session-secret
          ALLOW_DEV_TOKENS: "1"
          # Tier A is default-deny — it needs the operator to attest their receiving sites. The smoke
          # suite feeds its RF fixes as direct hearings on OE8XXX's own TNC, so name it as attested.
          FIRST_PARTY_SITES: OE8XXX
        run: |
          KEY=$(node tools/fedkey/genkey.mjs --raw)
          DB_PATH="$RUNNER_TEMP/acs.db" PORT=8787 INSTANCE=ci.node FED_PRIVATE_KEY="$KEY" \
            pnpm --filter @aprscaching/node-gateway start &
          BASE=http://127.0.0.1:8787 node tools/smoke/smoke.mjs
          BASE=http://127.0.0.1:8787 node tools/smoke/geofence.mjs

  conformance-worker:
    name: conformance (Cloudflare Worker)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: migrate local D1
        working-directory: workers/gateway
        run: CI=1 npx wrangler d1 migrations apply aprscaching --local
      - name: start wrangler dev + smoke
        # The Worker reads its secrets from .dev.vars; the smoke client reads INGEST_SECRET and
        # OPERATOR_SECRET from its own environment — both must carry the same values or writes 401.
        env:
          INGEST_SECRET: ci-conformance-ingest-secret
          OPERATOR_SECRET: ci-conformance-operator-secret
        run: |
          KEY=$(node tools/fedkey/genkey.mjs --raw)
          # FIRST_PARTY_SITES=OE8XXX names the smoke suite's receiving site as attested (Tier A is default-deny).
          printf 'INSTANCE=ci.worker\nFED_PRIVATE_KEY=%s\nINGEST_SECRET=ci-conformance-ingest-secret\nOPERATOR_SECRET=ci-conformance-operator-secret\nSESSION_SECRET=ci-conformance-session-secret\nALLOW_DEV_TOKENS=1\nFIRST_PARTY_SITES=OE8XXX\n' "$KEY" > workers/gateway/.dev.vars
          (cd workers/gateway && CI=1 npx wrangler dev --port 8787 --local --ip 127.0.0.1 &)
          BASE=http://127.0.0.1:8787 node tools/smoke/smoke.mjs
          BASE=http://127.0.0.1:8787 node tools/smoke/geofence.mjs

  conformance-federation:
    name: conformance (federation — 2 instances)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: publisher + subscriber + federation smoke
        # Shared by the two gateways AND the federation smoke client (ingest writes, operator calls).
        env:
          INGEST_SECRET: ci-conformance-ingest-secret
          OPERATOR_SECRET: ci-conformance-operator-secret
          SESSION_SECRET: ci-conformance-session-secret
          ALLOW_DEV_TOKENS: "1"
        run: |
          KEY=$(node tools/fedkey/genkey.mjs --raw)
          SUBKEY=$(node tools/fedkey/genkey.mjs --raw) # corroboration questions are signed
          PUBPUB=$(node -e "process.stdout.write(JSON.parse(Buffer.from(process.argv[1],'base64')).pub)" "$KEY")
          PUB2=$(node -e "process.stdout.write(JSON.parse(Buffer.from(process.argv[1],'base64')).pub)" "$(node tools/fedkey/genkey.mjs --raw)")
          PUB3=$(node -e "process.stdout.write(JSON.parse(Buffer.from(process.argv[1],'base64')).pub)" "$(node tools/fedkey/genkey.mjs --raw)")
          HIST="[{\"x\":\"$PUB2\",\"since\":1},{\"x\":\"$PUB3\",\"since\":1,\"revoked\":true}]"
          REG=$(node tools/fedkey/signregistry.mjs "[{\"instance\":\"oe.pub\",\"url\":\"http://127.0.0.1:8801\",\"key\":\"$PUBPUB\",\"operator\":\"OE8APR\"}]" --raw)
          FED_REGISTRY=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).FED_REGISTRY)" "$REG")
          FED_REGISTRY_KEY=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).FED_REGISTRY_KEY)" "$REG")
          # The publisher attests OE8XXX, the IGate its RF fix comes through, so it may corroborate for peers.
          DB_PATH="$RUNNER_TEMP/pub.db" PORT=8801 INSTANCE=oe.pub FED_PRIVATE_KEY="$KEY" FED_KEY_HISTORY="$HIST" FIRST_PARTY_SITES=OE8XXX \
            FED_OPERATOR=OE8APR FED_APRS_CALL=OE8APR-12 FED_RELAY_SECRET=relaysecret \
            FED_ENDPOINTS='[{"transport":"https","address":"http://127.0.0.1:8801","priority":10}]' \
            pnpm --filter @aprscaching/node-gateway start &
          # A two-instance network has one corroborating peer, so the subscriber accepts a quorum of one.
          DB_PATH="$RUNNER_TEMP/sub.db" PORT=8802 INSTANCE=oe.sub FED_PRIVATE_KEY="$SUBKEY" FED_PEERS=http://127.0.0.1:8801 FED_CORROBORATION_QUORUM=1 \
            FED_SUBMIT_SECRET=submitsecret FED_RELAY_SECRET=relaysecret FED_REGISTRY="$FED_REGISTRY" FED_REGISTRY_KEY="$FED_REGISTRY_KEY" \
            pnpm --filter @aprscaching/node-gateway start &
          PUB=http://127.0.0.1:8801 SUB=http://127.0.0.1:8802 RELAY_SECRET=relaysecret node tools/smoke/federation.mjs

  conformance-bun:
    name: conformance (Bun + bun:sqlite)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      # The MeshCom core is bundled once and run on Node, Bun and workerd; all three must agree.
      - run: pnpm run conformance:meshcom
        env: { CONFORMANCE_REQUIRE_BUN: "1" }
      - name: start bun-gateway + smoke
        env:
          INGEST_SECRET: ci-conformance-ingest-secret
          OPERATOR_SECRET: ci-conformance-operator-secret
          SESSION_SECRET: ci-conformance-session-secret
          ALLOW_DEV_TOKENS: "1"
          # Tier A is default-deny — name the smoke suite's receiving site (OE8XXX) as attested.
          FIRST_PARTY_SITES: OE8XXX
        run: |
          KEY=$(node tools/fedkey/genkey.mjs --raw)
          DB_PATH="$RUNNER_TEMP/bun.db" PORT=8787 INSTANCE=ci.bun FED_PRIVATE_KEY="$KEY" \
            bun run servers/bun/server.ts &
          BASE=http://127.0.0.1:8787 node tools/smoke/smoke.mjs
          BASE=http://127.0.0.1:8787 node tools/smoke/geofence.mjs

  e2e-audio:
    name: e2e (live mic decode — Chromium fake-audio)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # playwright-core drives an existing browser; fetch a matching Chromium into ~/.cache/ms-playwright
      # so audio-mic.mjs (which resolves via chromium.executablePath()) finds it. Version pinned to match.
      - run: npx --yes playwright@1.61.1 install --with-deps chromium
      - run: node tools/e2e/audio-mic.mjs
