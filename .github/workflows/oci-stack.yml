name: oci-stack
# Runs when release-please.yml calls it with the new release's tag, or by hand: a dispatch with a
# tag (or on a tag ref) rebuilds that release's assets; a dispatch on a branch only builds and uploads
# the workflow artifact, and the zip goes to a GitHub release only for a tag. A pushed tag starts
# nothing, so each release is built once and release-verify always follows it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and attach to (e.g. v1.0.0); empty builds the artifact only
        required: false
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v1.0.0)
        type: string
        required: true

# Default read-only; the build job elevates to contents:write only to attach the stack to the release.
permissions:
  contents: read

jobs:
  # The pinned OCI CLI installs on the VM's Python and architecture before the stack is built (oci-cli.yml).
  oci-cli:
    uses: ./.github/workflows/oci-cli.yml
    with:
      ref: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

  build:
    needs: oci-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the stack zip to the GitHub release
    env:
      # The release tag: the caller's or the dispatch's input, or the dispatched tag ref; empty on a
      # branch dispatch without one.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      # The "Deploy to Oracle Cloud" button hands Resource Manager a zip URL sight unseen, so the
      # consistency guard runs here too rather than trusting that CI saw this commit.
      - run: node tools/checks/oci-stack.mjs
      - run: bash scripts/build-oci-stack.sh "${TAG:-$GITHUB_REF_NAME}"
      # A release stack must name its tag's commit, or the VM would deploy the tag unchecked.
      - if: env.TAG != ''
        run: |
          want="$(git rev-parse "refs/tags/$TAG^{commit}")"
          unzip -p dist/oci/aprscaching-oci-stack.zip main.tf | grep -qx "  release_commit = \"$want\"" ||
            { echo "the stack zip does not pin $TAG to $want" >&2; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: aprscaching-oci-stack, path: dist/oci/* }
      # releases/latest/download/aprscaching-oci-stack.zip is the button's stable target, so every
      # release must carry the asset under exactly that name.
      # Attaches to the tag's existing release (release-please creates it), keeping its notes.
      - if: env.TAG != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { tag_name: "${{ env.TAG }}", files: dist/oci/aprscaching-oci-stack.zip }
