name: desktop-release
# Runs when release-please.yml calls it with the new release's tag, or by hand: a dispatch with a
# tag (or on a tag ref) rebuilds that release's assets; a dispatch on a branch only builds and uploads
# the workflow artifact, and the binaries go to a GitHub release only for a tag. A pushed tag starts
# nothing, so each release is built once and release-verify always follows it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and attach to (e.g. v1.0.0); empty builds the artifact only
        required: false
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v1.0.0)
        type: string
        required: true

# Default read-only. The build runs install scripts and every build tool, so it holds a read token and restores
# no cache; only the attach job, which checks out nothing and runs no repository code, holds contents:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest # Bun cross-compiles every target from one runner
    outputs:
      tag: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    env:
      # The release tag: the caller's or the dispatch's input, or the dispatched tag ref; empty on a
      # branch dispatch without one.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      # no cache, so the release reads only its own lockfile and the registry
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version-file: .bun-version }
      - run: pnpm install --frozen-lockfile
      - run: bash deploy/desktop/build-exe.sh "${TAG:-$GITHUB_REF_NAME}"
      # The Linux binary on this runner: it starts from its embedded build and serves the web app's
      # WebAssembly (Direwolf's modem) as application/wasm, before anything is uploaded.
      - run: bash deploy/desktop/smoke.sh dist/desktop/aprscaching-linux-x64
      # dist/desktop holds the binaries and the Bun runtime's licence notices (THIRD-PARTY-NOTICES.txt,
      # BUN-LICENSE.txt), so the artifact and the release carry the notices with the binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: aprscaching-desktop, path: dist/desktop/* }
  attach:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the desktop binaries to the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: aprscaching-desktop, path: dist/desktop }
      # Attaches to the tag's existing release (release-please creates it), keeping its notes.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { tag_name: "${{ needs.build.outputs.tag }}", files: dist/desktop/* }
  # NOTE: signed/notarized macOS binaries need a macos runner + Apple Developer ID secrets;
  # signed Windows needs an Authenticode cert. Add a separate job when you have them.
