name: desktop-release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

# Default read-only; the build job elevates to contents:write only to publish the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest # Bun cross-compiles every target from one runner
    permissions:
      contents: write # create the GitHub release + upload the desktop binaries
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: bash deploy/desktop/build-exe.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: aprscaching-desktop, path: dist/desktop/* }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with: { files: dist/desktop/* }
  # NOTE: signed/notarized macOS binaries need a macos runner + Apple Developer ID secrets;
  # signed Windows needs an Authenticode cert. Add a separate job when you have them.
