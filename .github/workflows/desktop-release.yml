name: desktop-release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

# Default read-only; the build job elevates to contents:write only to publish the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest # Bun cross-compiles every target from one runner
    permissions:
      contents: write # create the GitHub release + upload the desktop binaries
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: bash deploy/desktop/build-exe.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: aprscaching-desktop, path: dist/desktop/* }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with: { files: dist/desktop/* }
  # NOTE: signed/notarized macOS binaries need a macos runner + Apple Developer ID secrets;
  # signed Windows needs an Authenticode cert. Add a separate job when you have them.
