name: docs

# Builds the MkDocs manual with --strict (no broken links / bad nav) on every change, and publishes
# it to GitHub Pages from the default branch. The manual is the support surface SUPPORT.md and the
# issue templates point people at, so it has to be reachable without a git checkout.
on:
  push:
    branches: [main, dev]
    paths: &paths
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
      # the manual's theme and Mermaid build come from the web app (tools/dev/docs-theme.mjs)
      - "apps/web/src/styles/tokens.css"
      - "apps/web/src/styles/fonts.css"
      - "apps/web/public/fonts/**"
      - "tools/dev/docs-theme.mjs"
      - "pnpm-lock.yaml"
      # the house style (docs/contribute/style-guide.md)
      - ".vale.ini"
      - ".vale/**"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vale, pinned by version and checksum: an error (filler words, terminology) fails, the rest is shown
      - name: vale (house style)
        env:
          VALE: "3.24.0"
          VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
        run: |
          curl -fsSLo "$RUNNER_TEMP/vale.tgz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE}/vale_${VALE}_Linux_64-bit.tar.gz"
          echo "$VALE_SHA256  $RUNNER_TEMP/vale.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vale.tgz" -C "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" docs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # only the web app's dependencies: the theme generator copies Mermaid's locked build from there
      - run: pnpm install --frozen-lockfile --filter @aprscaching/web
      # the committed theme must match the app's tokens; then write it, with Mermaid, for the build
      - run: node tools/dev/docs-theme.mjs --check
      - run: node tools/dev/docs-theme.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }

  deploy:
    name: publish to Pages
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
