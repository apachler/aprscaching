name: docs

# Cheap guard: the MkDocs manual must build with --strict (no broken links / bad nav).
on:
  push:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          # No `cache: pip` — setup-python v6 hard-errors on it without a requirements.txt/pyproject.toml,
          # and the single mkdocs-material install below is too cheap to be worth a lockfile.
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
