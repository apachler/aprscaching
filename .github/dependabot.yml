version: 2
updates:
  # npm / pnpm workspace — one PR set for the whole monorepo, grouped to cut noise.
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions — keep the pinned SHAs current (Dependabot bumps the SHA + the # vX comment).
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # The manual's build: MkDocs and Material for MkDocs (docs/requirements.in), compiled with hashes into
  # docs/requirements.txt; Dependabot updates both.
  - package-ecosystem: pip
    directory: "/docs"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: "docs(deps)"

  # The OCI stack's CLI (deploy/oci/oci-cli-requirements.txt), every package pinned by hash, resolved for the
  # Python in deploy/oci/.python-version (the VM image's, 3.12 on Ubuntu 24.04). An oci-cli bump that needs other
  # pins to move is regenerated with the command in that file's header.
  - package-ecosystem: pip
    directory: "/deploy/oci"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    # oci-cli pins most of its dependencies to exact versions, so a bump of any other package in the set breaks
    # the install. Only oci-cli itself is proposed; the rest follows it when the set is regenerated, and
    # oci-cli.yml installs the proposed set on the pull request.
    allow:
      - dependency-name: "oci-cli"
    commit-message:
      prefix: "chore(deps)"

  # Docker base images, pinned by tag and multi-arch index digest. Dependabot refreshes the digest as the tag
  # moves; a new major (Node 26, a newer Ubuntu) is a deliberate change, not a weekly bump.
  - package-ecosystem: docker
    directories:
      - "/deploy"
      - "/servers/node"
      - "/apps/ingest"
      - "/tools/interop/*"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ubuntu images stay on an LTS release and take digest refreshes only: a minor bump would be an interim
      # release (24.10, 25.04, …) with nine months of support. Moving to the next LTS (26.04) is a deliberate
      # change, made by hand.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
