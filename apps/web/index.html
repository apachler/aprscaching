<!doctype html>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- the browser chrome follows the top bar of the theme (shell/theme.ts sets it for an explicit choice) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121c21" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#256b8b" />
    <script>
      /* The Appearance setting before the first paint, so a light or Phosphor choice never flashes the dark
         palette; format.ts normalizeTheme/resolveTheme are the rules, and test/theme.test.ts holds this to them. */
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem("acs.locale") || "{}") || {}).theme;
          if (t === "cogmind") t = "phosphor";
          if (t !== "auto" && t !== "light" && t !== "phosphor") t = "dark";
          if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* storage refused: the dark default from the tokens stands */
        }
      })();
    </script>
    <script>
      /* The landing hero is the largest paint, and the app finds it only after its script has run: when the
         landing is what opens (no remembered session, no visit to the platform this session, no deep link),
         fetch it now. The widths match Landing.tsx's hero srcset. */
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (localStorage.getItem("acs.session") || sessionStorage.getItem("acs.explore") === "1") return;
          if (q.has("view") || q.has("v") || q.has("demo")) return;
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.type = "image/avif";
          l.setAttribute(
            "imagesrcset",
            "/landing/hero-960.avif 960w, /landing/hero-1600.avif 1600w, /landing/hero-2560.avif 2560w",
          );
          l.setAttribute("imagesizes", "100vw");
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        } catch (e) {
          /* storage refused: the hero loads with the page */
        }
      })();
    </script>
