      - Caching: guides/caching.md
      - Hunting without signal: guides/offline.md
      - Your radio in the browser: guides/my-radio.md
      - The Shack: guides/shack.md
      - Rig control & weather: operate/rig-weather.md
  - Core concepts: concepts.md
  - Glossary: glossary.md
  - Operating an instance:
      - Deployment: operate/deployment.md
      - Deployment helpers: operate/helpers.md
      - Running in Docker: operate/docker.md
      - "Pocket: a station on a phone": operate/pocket.md
      - The offline map: operate/offline-map.md
      - Your first hour as sysop: operate/first-hour.md
      - "Connect a radio: quick starts": operate/quickstarts.md
      - RF ingest & transports: operate/rf-ingest.md
      - MeshCom: operate/meshcom.md
      - Packet BBS & node: operate/packet.md
      - Amateur-radio compliance: operate/rf-regulatory.md
      - Administration: operate/administration.md
      - Federation: guides/federation.md
      - Run an instance on 44Net: operate/44net.md
  - Reference:
      - HTTP API: reference/api.md
      - Configuration: reference/configuration.md
      - Cloudflare D1 costs: reference/cloudflare-costs.md
      - Command-line tools: reference/cli.md
      - Federation wire format: reference/federation-wire.md
      - MeshCom ExtUDP protocol: reference/meshcom-extudp.md
      - Licence registers: reference/licence-sources.md
  - Develop & contribute:
      - Run from source: getting-started.md
