# Serve the manual locally with:  pip install -r docs/requirements.txt && node tools/dev/docs-theme.mjs && mkdocs serve
# Build the static site with:     mkdocs build --strict
site_name: aprscaching
site_description: >-
  The manual for aprscaching — an APRS geocaching game and a full ham-radio Shack.
# Where the manual is published. Set so page metadata, the sitemap and canonical links resolve;
# .github/workflows/docs.yml deploys here from the default branch.
site_url: https://apachler.github.io/aprscaching/
repo_url: https://github.com/apachler/aprscaching
edit_uri: edit/dev/docs/
copyright: >-
  Documentation is CC-BY-SA-4.0. aprscaching is built by OE8APR from open specifications and is not
  affiliated with, sponsored by, or endorsed by the APRS trademark holder.

docs_dir: docs

# The docs LICENSE file lives beside the pages but is not itself a manual page.
exclude_docs: |
  LICENSE

# Dated review records: built and linkable, but kept out of the manual's navigation so a reader of the
# manual never mistakes a point-in-time review for documentation of the current state.
not_in_nav: |
  reviews/*

# A link to a missing heading fails `mkdocs build --strict`, the same as a link to a missing page.
validation:
  anchors: warn

theme:
  name: material
  # The manual follows the app's look: colours, type and shape come from the app's design tokens
  # (docs/stylesheets/tokens.gen.css, generated by tools/dev/docs-theme.mjs). The two schemes are the app's
  # Dark (slate) and Light (default) themes, following the system until the reader picks one; the manual
  # offers no Phosphor scheme.
  font: false # the app's own fonts are bundled; nothing is fetched from Google Fonts
  logo: assets/brand/beacon-green.png
  favicon: assets/brand/favicon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  # ```mermaid blocks become diagrams, drawn by docs/javascripts/diagrams.js; the in-app reader draws the same
  # blocks the same way (apps/web/src/docs/diagrams.ts). The class is not "mermaid", so Material's own
  # Mermaid integration, which would fetch it from a CDN on every page, stays off.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/tokens.gen.css
  - stylesheets/aprscaching.css

# Draws the diagrams with the manual's own copy of Mermaid (tools/dev/docs-theme.mjs copies the web app's
# locked build to assets/vendor/), loaded only on a page that has a diagram.
extra_javascript:
  - javascripts/diagrams.js

