# Serve the manual locally with:  pip install mkdocs-material && mkdocs serve
# Build the static site with:     mkdocs build --strict
site_name: aprscaching
site_description: >-
  The manual for aprscaching — an APRS geocaching game and a full ham-radio Shack.
# Where the manual is published. Set so page metadata, the sitemap and canonical links resolve;
# .github/workflows/docs.yml deploys here from the default branch.
site_url: https://apachler.github.io/aprscaching/
repo_url: https://github.com/apachler/aprscaching
edit_uri: edit/dev/docs/
copyright: >-
  Documentation is CC-BY-SA-4.0. aprscaching is built by OE8APR from open specifications and is not
  affiliated with, sponsored by, or endorsed by the APRS trademark holder.

docs_dir: docs

# The docs LICENSE file lives beside the pages but is not itself a manual page.
exclude_docs: |
  LICENSE

# Dated review records: built and linkable, but kept out of the manual's navigation so a reader of the
# manual never mistakes a point-in-time review for documentation of the current state.
not_in_nav: |
  reviews/*

# A link to a missing heading fails `mkdocs build --strict`, the same as a link to a missing page.
validation:
  anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Start here: start-here.md
  - Guides:
      - Your account: guides/account.md
      - Caching: guides/caching.md
      - Hunting without signal: guides/offline.md
      - Your radio in the browser: guides/my-radio.md
      - The Shack: guides/shack.md
      - Rig control & weather: operate/rig-weather.md
  - Core concepts: concepts.md
  - Glossary: glossary.md
  - Operating an instance:
      - Deployment: operate/deployment.md
      - Deployment helpers: operate/helpers.md
      - Running in Docker: operate/docker.md
      - "Pocket: a station on a phone": operate/pocket.md
      - The offline map: operate/offline-map.md
      - Your first hour as sysop: operate/first-hour.md
      - "Connect a radio: quick starts": operate/quickstarts.md
      - RF ingest & transports: operate/rf-ingest.md
      - MeshCom: operate/meshcom.md
      - Packet BBS & node: operate/packet.md
      - Amateur-radio compliance: operate/rf-regulatory.md
      - Administration: operate/administration.md
      - Federation: guides/federation.md
      - Run an instance on 44Net: operate/44net.md
  - Reference:
      - HTTP API: reference/api.md
      - Configuration: reference/configuration.md
      - Cloudflare D1 costs: reference/cloudflare-costs.md
      - Command-line tools: reference/cli.md
      - Federation wire format: reference/federation-wire.md
      - MeshCom ExtUDP protocol: reference/meshcom-extudp.md
      - Licence registers: reference/licence-sources.md
  - Develop & contribute:
      - Run from source: getting-started.md
      - Testing & verification: reference/testing.md
      - Data model: reference/data-model.md
      - Specification registry: reference/specs.md
  - Design notes:
      - MeshCom integration: design/meshcom.md
      - Logging finds over radio messages: design/radio-find-logging.md
      - Caches on the MeshCom map: design/meshcom-tdeck-map.md
  - About: about.md
