packages:
  - "packages/*"
  - "workers/*"
  - "servers/*"
  - "apps/*"

# pnpm >= 10 refuses to run dependency lifecycle scripts unless explicitly allowlisted
# (supply-chain hardening). These three need their install/postinstall to function:
# better-sqlite3 (node-gyp native build), esbuild (platform binary fetch), sharp (libvips).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

# Supply-chain: refuse freshly-published packages (malware is usually yanked within hours).
# pnpm 11 defaults to 24 h; 12 h keeps real protection without blocking day-old routine bumps.
minimumReleaseAge: 720

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true

# Security floors for transitive dev-tooling dependencies, raised
# past published advisories until their parents pick the fixes up.
overrides:
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  undici@>=7.28.0 <7.29.1: "^7.29.1"
  # Mermaid's parser (chevrotain) pins an older lodash-es with published advisories; the web app never
  # uses the affected template or unset/omit paths, but the floor keeps the lockfile clean.
  lodash-es@<4.18.0: "^4.18.1"
