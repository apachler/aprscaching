packages:
  - "packages/*"
  - "workers/*"
  - "servers/*"
  - "apps/*"

# pnpm >= 10 refuses to run dependency lifecycle scripts unless explicitly allowlisted
# (supply-chain hardening). These four need their install/postinstall to function:
# better-sqlite3 (node-gyp native build), esbuild + workerd (platform binary fetch), sharp (libvips).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
  - workerd

# Supply-chain: refuse freshly-published packages (malware is usually yanked within hours).
# pnpm 11 defaults to 24 h; 12 h keeps real protection without blocking day-old routine bumps.
minimumReleaseAge: 720

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

# Security floors for transitive dev-tooling dependencies (lint and local Workers tooling), raised
# past published advisories until their parents pick the fixes up.
overrides:
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  undici@>=7.28.0 <7.29.1: "^7.29.1"
