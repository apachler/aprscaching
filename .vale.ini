# Vale: the manual's house style (docs/contribute/style-guide.md). The docs workflow runs it; an error fails the
# build, a warning or suggestion is shown. The dated records under docs/reviews/ are history and not checked.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Ham

[formats]
md = md

[docs/**/*.md]
BasedOnStyles = Vale, APRScaching
# British and American spellings both occur, and the ham vocabulary is large; spelling is left to review.
Vale.Spelling = NO
# A repeated word across a code span or a table cell is not a typo.
Vale.Repetition = NO
APRScaching.Readability = NO

[docs/play/**/*.md]
BasedOnStyles = Vale, APRScaching
Vale.Spelling = NO
Vale.Repetition = NO
APRScaching.Readability = YES

[docs/reviews/**/*.md]
BasedOnStyles =
