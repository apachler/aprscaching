# Play pages are read by players in the field: aim for a Flesch-Kincaid grade of 9 or below.
extends: metric
message: "Try to keep the Flesch-Kincaid grade below 9 (it is %s)."
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests
formula: |
  (0.39 * (words / sentences)) + (11.8 * (syllables / words)) - 15.59
condition: "> 9"
level: warning
