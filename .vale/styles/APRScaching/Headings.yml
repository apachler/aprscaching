# Headings are sentence case: "Log a find", not "Log A Find". Names keep their capitals (the vocabulary).
extends: capitalization
message: "Use sentence case for '%s'."
level: warning
scope: heading
match: $sentence
indicators:
  - ":"
exceptions:
  - APRS
  - APRS-IS
  - APRScaching
  - aprscaching
  - Shack
  - MeshCom
