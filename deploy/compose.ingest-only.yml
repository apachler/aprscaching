# Ingest-only: an ingest box that forwards RF/IS to a gateway elsewhere (INGEST_URL). No local DB/SPA.
# This is the operator's local RF node feeding any remote gateway: a Self-host instance on another box,
# an Oracle Cloud instance, or a shared gateway.
# Up:  docker compose -f compose.ingest-only.yml up -d --build

# Cap container logs so an unattended Pi can't fill its SD card (the json-file driver is
# unbounded by default). ~30 MB/service retained.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: aprscaching:local
    command: ["pnpm", "--filter", "@aprscaching/ingest", "start"]
    # Every RF transport setting in .env reaches the ingest (KISS_TNC_HOST, IGATE_*, MESHCOM_*, …).
    env_file:
      - path: .env
        required: false
    # MeshCom nodes send UDP 1799 to this host. Publish it on the host's LAN address only, and set
    # MESHCOM_BIND=0.0.0.0 in .env (inside the container that is the container's own interface).
    # ports: ["192.168.1.10:1799:1799/udp"]
    # A serial TNC or PTT line: pass the device in. The image's user (UID 10001) is in `dialout`, GID 20 on Debian,
    # Ubuntu and Raspberry Pi OS; where the host's device group has another GID (`stat -c %g /dev/ttyUSB0`), add
    # that GID with group_add.
    # devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]
    # group_add: ["18"]
    # A soundcard port (SOUNDCARD_DEVICE) needs the sound devices, and its PTT device: a CM108's /dev/hidraw*, a
    # GPIO chip (/dev/gpiochip0). The user is in `audio` (GID 29); add the GPIO chip's group (`stat -c %g`) too.
    # devices: ["/dev/snd:/dev/snd", "/dev/hidraw0:/dev/hidraw0"]
    # The settings come from .env alone (INGEST_URL, e.g. https://gateway.example.net/ingest; the APRS-IS
    # login and filter; INGEST_SECRET, or BOX_ID + BOX_KEY for a box enrolled with its own key). A key .env
    # leaves out stays unset, so the ingest's own default applies; an interpolated one would arrive empty.
    environment:
      # the ingest box holds only its own credential: blank every gateway-only secret (secret in
      # packages/shared/src/configkeys.ts and not read by the ingest), should .env hold one
      OPERATOR_SECRET: ""
      SESSION_SECRET: ""
      FED_PRIVATE_KEY: ""
      FED_CORROBORATION_SECRET: ""
      FED_SUBMIT_SECRET: ""
      FED_RELAY_SECRET: ""
      OKAPI_KEY: ""
      GMA_API_KEY: ""
      EMAIL_API_KEY: ""
      SMTP_PASS: ""
      VAPID_PRIVATE: ""
      TUNNEL_TOKEN: ""
      CF_API_TOKEN: ""
    restart: unless-stopped
    logging: *default-logging
