# Ingest-only: forward RF/IS to a REMOTE gateway (e.g. a Cloudflare Worker). No local DB/SPA.
# This is the operator's local RF box in the Cloudflare split, and the generic "operator RF node".
# Up:  docker compose -f compose.ingest-only.yml up -d --build

# Cap container logs so an unattended Pi can't fill its SD card (the json-file driver is
# unbounded by default). ~30 MB/service retained.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: aprscaching:local
    command: ["pnpm", "--filter", "@aprscaching/ingest", "start"]
    # Every RF transport setting in .env reaches the ingest (KISS_TNC_HOST, IGATE_*, MESHCOM_*, …).
    env_file:
      - path: .env
        required: false
    # MeshCom nodes send UDP 1799 to this host. Publish it on the host's LAN address only, and set
    # MESHCOM_BIND=0.0.0.0 in .env (inside the container that is the container's own interface).
    # ports: ["192.168.1.10:1799:1799/udp"]
    environment:
      APRSIS_HOST: ${APRSIS_HOST:-rotate.aprs2.net}
      APRSIS_PORT: ${APRSIS_PORT:-14580}
      APRSIS_CALLSIGN: ${APRSIS_CALLSIGN}
      APRSIS_PASSCODE: ${APRSIS_PASSCODE}
      APRSIS_FILTER: ${APRSIS_FILTER}
      INGEST_URL: ${INGEST_URL} # e.g. https://gateway.<you>.workers.dev/ingest
      INGEST_SECRET: ${INGEST_SECRET} # or per-operator peer key when feeding a shared gateway
      # the ingest box holds only INGEST_SECRET — never the gateway's operator or session secret
      OPERATOR_SECRET: ""
      SESSION_SECRET: ""
    restart: unless-stopped
    logging: *default-logging
