# Self-host stack: gateway + ingest + Caddy, on any VM, VPS, Pi or mini-PC.
# Up:  docker compose up -d --build          (config comes from ./.env — run ./setup.sh once)

# Bound container logs (the json-file driver is unbounded by default) so an unattended box
# can't fill its disk. ~30 MB/service retained.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    # SOURCE_COMMIT names the commit in the image's source link: run compose as
    # `SOURCE_COMMIT=$(git rev-parse HEAD) docker compose …` (deploy/aprscaching does it itself)
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SOURCE_COMMIT: "${SOURCE_COMMIT:-}" } }
    image: aprscaching:local
    command: ["pnpm", "--filter", "@aprscaching/node-gateway", "start"]
    # Every setting in .env reaches the gateway (ADMIN_CALLSIGNS, RP_ID, FIRST_PARTY_SITES, OPERATOR_*,
    # SOURCE_REPO, FED_*, …); the `environment:` entries below take precedence over it.
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/aprscaching.db
      # cache media in the data volume, so it survives a rebuild of the image
      MEDIA_DIR: /data/media
      PORT: "8080"
      # The gateway refuses to boot without a real INGEST_SECRET — without this passthrough the
      # container restart policy would just crash-loop it. An empty SESSION_SECRET is generated on first
      # start and kept in the data volume; an empty OPERATOR_SECRET closes the operator's machine paths.
      INGEST_SECRET: ${INGEST_SECRET}
      OPERATOR_SECRET: ${OPERATOR_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      INSTANCE: ${INSTANCE:-}
      APP_URL: ${APP_URL:-}
      # Caddy is the only way in and sets X-Forwarded-For itself, so the gateway keys per-IP rate
      # limits on the forwarded client address rather than on Caddy's.
      TRUST_PROXY: "1"
    volumes: ["data:/data"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # /health is the gateway's readiness endpoint; node's built-in fetch avoids needing curl.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest: # RF/IS ingest. For RF, run this on the OPERATOR'S box (see rule).
    image: aprscaching:local
    command: ["pnpm", "--filter", "@aprscaching/ingest", "start"]
    # Every RF transport setting in .env reaches the ingest (KISS_TNC_HOST, IGATE_*, MESHCOM_*, …).
    env_file:
      - path: .env
        required: false
    # MeshCom nodes send UDP 1799 to this host. Publish it on the host's LAN address only, and set
    # MESHCOM_BIND=0.0.0.0 in .env (inside the container that is the container's own interface).
    # ports: ["192.168.1.10:1799:1799/udp"]
    # The APRS-IS login, filter and INGEST_SECRET come from .env alone: a key .env leaves out stays unset
    # here, so the ingest's own default applies; an interpolated one would arrive empty.
    environment:
      # inside the stack the gateway is the `gateway` service, not the ingest's localhost default
      INGEST_URL: ${INGEST_URL:-http://gateway:8080/ingest}
      # .env reaches this container too: blank every gateway-only secret (secret in
      # packages/shared/src/configkeys.ts and not read by the ingest), so the ingest never holds one
      OPERATOR_SECRET: ""
      SESSION_SECRET: ""
      FED_PRIVATE_KEY: ""
      FED_CORROBORATION_SECRET: ""
      FED_SUBMIT_SECRET: ""
      FED_RELAY_SECRET: ""
      OKAPI_KEY: ""
      GMA_API_KEY: ""
      EMAIL_API_KEY: ""
      VAPID_PRIVATE: ""
      TUNNEL_TOKEN: ""
      CF_API_TOKEN: ""
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  webdist: # one-shot: publish the SPA built inside the image into the volume Caddy serves.
    # apps/web/dist is gitignored, so a fresh clone has no host build — the image is the source
    # of truth for the static bundle and this copy step keeps Caddy self-contained.
    image: aprscaching:local
    command: ["sh", "-c", "rm -rf /srv/web/* && cp -r /app/apps/web/dist/. /srv/web/"]
    volumes: ["webdist:/srv/web"]
    restart: "no"
    logging: *default-logging

  caddy: # TLS + static SPA + reverse proxy
    image: caddy:2
    # 443/udp is HTTP/3 (QUIC), which Caddy serves beside HTTPS
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webdist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_started }
      webdist: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *default-logging

volumes: { data: {}, caddy_data: {}, caddy_config: {}, webdist: {} }
