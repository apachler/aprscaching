#cloud-config
# OCI Ampere A1 (Ubuntu) bootstrap. Rendered by main.tf through templatefile(): each dollar-brace
# placeholder below is substituted from the vars map. Both payloads arrive base64-encoded, so no value
# from the stack is ever parsed as YAML or shell here: firstboot.sh does the work (Docker from Docker's
# signed apt repository, the verified checkout, deploy/aprscaching init selfhost, compose up, doctor)
# and reads its settings line by line.
write_files:
  - path: /etc/aprscaching/firstboot.env
    owner: root:root
    permissions: "0600"
    encoding: b64
    content: ${SETTINGS_B64}
  - path: /usr/local/sbin/aprscaching-firstboot
    owner: root:root
    permissions: "0700"
    encoding: b64
    content: ${FIRSTBOOT_B64}
runcmd:
  - [/usr/local/sbin/aprscaching-firstboot]
