#
# Resource Manager stack UI. Every variable in main.tf appears here exactly once, so the console
# prompts for real inputs instead of raw OCIDs; tools/checks/oci-stack.mjs enforces that pairing.
title: APRScaching
description: >-
  An APRS geocaching game and a full ham-radio Shack, on one Always-Free Ampere A1 VM (2 OCPUs, 12 GB,
  a reserved public IP). The stack builds its own network, resolves the Ubuntu image itself, and boots
  the Docker stack via cloud-init — you supply your callsign and an SSH key. SSH goes through OCI Bastion
  only; port 22 is closed to the internet.
schemaVersion: 1.1.0
version: "1"
locale: en

variableGroups:
  - title: Resource Manager
    visible: false
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region
  - title: Your station
    variables:
      - aprsis_callsign
      - aprsis_passcode
      - aprsis_filter
  - title: Public site
    variables:
      - domain
  - title: Host
    variables:
      - ssh_public_key
      - availability_domain_number
  - title: Network
    variables:
      - use_reserved_ip
      - existing_reserved_ip_id
      - bastion_client_cidrs
  - title: Backups
    variables:
      - create_backup_bucket
      - boot_volume_backups
  - title: Sizing and source
    visible: false
    variables:
      - ocpus
      - memory_in_gbs
      - allow_beyond_always_free
      - boot_volume_size_in_gbs
      - repo_url
      - repo_ref

variables:
  tenancy_ocid:
    type: string
    title: Tenancy OCID
    required: true
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Compartment
    description: The compartment the VM and its network are created in.
    required: true
  region:
    type: oci:identity:region:name
    title: Region
    required: true

  aprsis_callsign:
    type: string
    title: Callsign
    description: Your amateur-radio callsign, without an SSID. You administer the instance with it, and it logs the instance in to APRS-IS.
    required: true
    pattern: "^[A-Za-z0-9]{3,7}$"
  aprsis_passcode:
    type: password
    title: APRS-IS passcode
    description: Optional. The passcode issued for that callsign; it authenticates the feed and verifies nothing about your licence. Blank runs receive-only until you set it on the VM.
    required: false
    pattern: "^(-1|[0-9]{1,5})?$"
  aprsis_filter:
    type: string
    title: Feed filter
    description: An APRS-IS server-side filter. r/<lat>/<lon>/<km> keeps the feed local to your area and the running costs down.
    required: true
    default: r/47.07/15.42/300

  domain:
    type: string
    title: Hostname
    description: A hostname you point at the VM, for automatic TLS. Leave it as :80 to serve plain HTTP over the IP address.
    required: true
    default: ":80"

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: SSH public key
    description: Grants console access to the ubuntu user on the VM.
    required: true
  availability_domain_number:
    type: number
    title: Availability domain
    description: Which availability domain to place the VM in. Raise it and re-apply if OCI reports that it is out of host capacity.
    required: true
    default: 1
    minimum: 1
    maximum: 3

  ocpus:
    type: number
    title: Cores
    description: >-
      Ampere A1 cores. An Always-Free-only tenancy has 2 in total across all instances (1,500 OCPU hours a
      month, since mid-2026); more needs "Allow beyond Always Free".
    required: true
    default: 2
    minimum: 1
    maximum: 4
  memory_in_gbs:
    type: number
    title: Memory (GB)
    description: >-
      An Always-Free-only tenancy has 12 GB in total across all instances (9,000 GB hours a month); more needs
      "Allow beyond Always Free".
    required: true
    default: 12
    minimum: 6
    maximum: 24
  allow_beyond_always_free:
    type: boolean
    title: Allow beyond Always Free
    description: >-
      Allow more than 2 OCPUs or 12 GB. Above that an Always-Free-only tenancy is billed; a Pay As You Go
      tenancy may still have a larger free A1 allowance (see Limits, Quotas and Usage).
    default: false
  use_reserved_ip:
    type: boolean
    title: Reserved public IP
    description: >-
      Keep the VM's address (and your DNS) when it is re-created. Free of charge; free-tier tenancies reportedly
      have one. Deleting the stack releases a reserved IP it created.
    default: true
  existing_reserved_ip_id:
    type: string
    title: Existing reserved IP (OCID)
    description: >-
      Reuse a reserved public IP you already have: the stack creates none and outputs the command that assigns
      yours to the VM. Deleting the stack then keeps it. Leave empty to create one.
    required: false
    default: ""
  bastion_client_cidrs:
    type: array
    items:
      type: string
    title: Bastion client networks
    description: >-
      Addresses allowed to open SSH sessions through the Bastion. IAM and your SSH key authenticate every
      session; narrow it to your own network if you like.
    default:
      - 0.0.0.0/0
  boot_volume_size_in_gbs:
    type: number
    title: Boot volume (GB)
    description: Always Free includes 200 GB of block storage in total (boot volumes included).
    required: true
    default: 50
    minimum: 50
    maximum: 200
  repo_url:
    type: string
    title: Repository
    required: true
    default: https://github.com/apachler/aprscaching
  repo_ref:
    type: string
    title: Branch or tag
    description: A stack downloaded from a release pins that release's tag.
    required: true
    default: main

  create_backup_bucket:
    type: boolean
    title: Nightly backups to a bucket
    description: A private Object Storage bucket the VM backs up to every night, keeping 14 days. The stack also creates a dynamic group and a policy that let this VM write to that bucket only, which needs rights to manage dynamic groups and policies (a tenancy administrator has them). Untick it if Apply fails on the dynamic group.
    default: true
  boot_volume_backups:
    type: boolean
    title: Weekly boot volume backups
    description: Also back up the whole boot volume every Sunday, keeping four. Always Free includes five volume backups.
    default: false

outputs:
  public_ip:
    type: string
    title: Public IP
    visible: true
  url:
    type: link
    title: Open the instance
    visible: true
  reserved_ip_id:
    type: string
    title: Reserved IP (OCID)
    visible: true
  assign_reserved_ip_command:
    type: copyableString
    title: Assign your existing reserved IP
    visible: true
  backup_bucket:
    type: string
    title: Backup bucket
    visible: true
  login_command:
    type: copyableString
    title: Log in through the Bastion
    visible: true
  bastion_id:
    type: string
    title: Bastion
    visible: true
  instance_id:
    type: string
    title: Instance
    visible: true
  private_ip:
    type: string
    title: Private IP
    visible: true

outputGroups:
  - title: Your instance
    outputs:
      - url
      - public_ip
      - reserved_ip_id
      - assign_reserved_ip_command
      - backup_bucket
  - title: SSH through the Bastion
    outputs:
      - login_command
      - bastion_id
      - instance_id
      - private_ip

primaryOutputButton: url
