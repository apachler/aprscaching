# Home/Pi override: expose via Cloudflare Tunnel (no port-forwarding / CGNAT-friendly).
# Up:  docker compose -f docker-compose.yml -f compose.home.yml up -d --build
services:
  gateway:
    environment:
      # every request arrives through the tunnel, so Cloudflare's cf-connecting-ip is the client
      TRUST_CF: "1"
  caddy:
    # No published ports: the tunnel reaches caddy on the internal network. `!reset` drops the base file's
    # ports (a plain `[]` merges with them and publishes 80/443 anyway); it needs Docker Compose 2.24 or newer.
    ports: !reset []
    environment:
      # only cloudflared, on the stack's own network, names the visitor in cf-connecting-ip
      CF_RANGES: private_ranges
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN} # from a named tunnel created in the Cloudflare dashboard
    depends_on: [caddy]
    restart: unless-stopped
    # Cap logs (compose anchors don't cross files, so this one is inline)
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
