; LinBPQ interop-peer config: a NET/ROM node + BBS reachable from the acs container over AXUDP.
; The driver console connects via telnet :8010 (user/password interop/interop).
SIMPLE
NODECALL=GB7BPQ
NODEALIAS=BPQ
IDMSG:
aprscaching interop test node
***
BTEXT:
interop
***
INFOMSG:
LinBPQ interop peer for the aprscaching test environment.
***
CTEXT:
Welcome to the interop BPQ node. C BBS for the mailbox.
***
; FULL_CTEXT=1 sends the CTEXT on callsign connects too (0 = alias connects only) — the
; outbound dial probe connects to the NODECALL and asserts on the CTEXT
FULL_CTEXT=1
LOCATOR=NONE
; NODESINTERVAL is in MINUTES — 1 keeps broadcasts inside the test's polling window
NODESINTERVAL=1

; AXUDP link to the acs container (both sides speak AX.25-in-UDP with the RFC 1226 CRC trailer on 10093)
PORT
 PORTNUM=1
 ID=AXUDP to acs
 TYPE=EXTERNAL
 DRIVER=BPQAXIP
 QUALITY=192
 MAXFRAME=4
 FRACK=3000
 RESPTIME=1000
 RETRIES=10
 PACLEN=236
 CONFIG
  UDP 10093
  ; BROADCAST declares which destinations are broadcast frames on this port — without it BPQ
  ; never transmits NODES to the B-flagged maps (the B flag only says where broadcasts go)
  BROADCAST NODES
  BROADCAST ID
  AUTOADDMAP
  MAP OE1ACS-7 acs UDP 10093 B
  MAP OE1ACS-1 acs UDP 10093 B
ENDPORT

; telnet access for the test driver
PORT
 PORTNUM=2
 ID=Telnet
 DRIVER=TELNET
 CONFIG
  LOGINPROMPT=user:
  PASSWORDPROMPT=password:
  MAXSESSIONS=10
  CTEXT=Interop telnet\n
  ; third field is the user's CALLSIGN — outbound connects source their L2 address from it, so
  ; it must be a valid AX.25 call. Fourth field left EMPTY gives the node command session with
  ; sysop rights (naming an APPLICATION here attaches to that app instead — and an app slot
  ; with no bound program answers "Application ... is not running")
  USER=interop,interop,OE1TST,,SYSOP
  TCPPORT=8010
  HTTPPORT=8008
ENDPORT

APPLICATION 1,BBS,,GB7BPQ-1,BPQBBS,255
APPLICATION 2,NODE,,GB7BPQ-7,BPQNOD,255
