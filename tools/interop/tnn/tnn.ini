# TheNetNode L1 device table (grammar per os/linux/init.c of TNN 1.79cb):
# '#' starts a comment, every other line is exactly one "key value" pair,
# and no line may exceed 80 characters (the parser reads 82-byte chunks).
tnn_procfile tnn.pid
buffers 10000
perms 077
# device 1: AX25IP driver (kisstype 8); AXIP/AXUDP peers come from
# ax25ip.cfg in the working directory ("socket udp" + "route" lines)
device ax25ip
kisstype 8
port 0
# device 2: telnet console; for kisstype 22 the device value is the TCP port
device 4711
kisstype 22
port 1
