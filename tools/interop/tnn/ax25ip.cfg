# AXIP/AXUDP routing for the TNN ax25ip driver (RFC 1226 framing; the
# UDP mode adds the CRC trailer). Syntax per os/linux/ax25ip.c:
#   socket udp [port]
#   route <call|default> <host> udp [port]
socket udp 10093
loglevel 2
route OE1ACS-7 acs udp 10093
route OE1ACS-1 acs udp 10093
route default acs udp 10093
