# aprsc interop-server config: a minimal standalone APRS-IS core for the compose network.
# ServerId INTEROP with its matching passcode (standard APRS-IS passcode algorithm).
ServerId   INTEROP
PassCode   27814
MyAdmin    "aprscaching interop CI"
MyEmail    interop@example.invalid
RunDir     data

LogRotate  10 5

UpstreamTimeout   30s
ClientTimeout     48h

# client port with server-side filter support (what the acs ingest dials)
Listen "igate"    igate    tcp ::  14580 hidden
# full feed, no filter needed (test drivers)
Listen "fullfeed" fullfeed tcp ::  10152 hidden
