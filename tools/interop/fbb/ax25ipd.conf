# ax25ipd: bridge the kernel AX.25 port to AXUDP. The container runs on the host network (AF_AX25 exists
# only in the initial network namespace), so peers are addressed by IP: acs at its fixed compose address,
# the fbb-ax25 dialer on the host. start.sh replaces the device line with kissattach's pty slave.
mode tnc
device /dev/ptmx
speed 9600
loglevel 2
socket udp 10093
route OE1ACS-7 172.31.93.10 udp 10093
route OE1ACS-1 172.31.93.10 udp 10093
route OE1PRB-2 127.0.0.1 udp 10094
